    <UserObject label="" plantUmlData="{&#xa;  &quot;data&quot;: &quot;@startuml\nautonumber\nskinparam sequenceMessageAlign center\nskinparam responseMessageBelowArrow true\n\nactor \&quot;Người dùng\\n(User)\&quot; as User\nparticipant \&quot;Mobile App\\n(UI / Deep Link\\n/ Maps SDK)\&quot; as App\nparticipant \&quot;Backend Server\\n(Chatbot / Map /\\nUtility Service)\&quot; as Backend\ndatabase \&quot;Database\\n(PostgreSQL /\\nPostGIS)\&quot; as DB\nparticipant \&quot;AI / NLP Engine\\n(LLM / RAG /\\nDialogflow)\&quot; as AI\nparticipant \&quot;Google Maps &amp;\\nLocation APIs\\n(Fused / Directions)\&quot; as GMaps\nparticipant \&quot;Cổng Thanh toán &amp;\\nNhà cung cấp\\n(Aggregator / Providers)\&quot; as Provider\n\n&#39; ==================== PHẦN 1: TÍCH HỢP AI CHATBOT &amp; DEEP LINK ====================\n== 1. Luồng Tích hợp AI Chatbot &amp; Điều hướng Thông minh (Deep Link) ==\n\nUser -&gt; App : Nhập câu hỏi (Text/Voice) hoặc chọn Suggestion Chips\\n(VD: \&quot;Đóng tiền điện\&quot; hoặc \&quot;Tìm chi nhánh gần nhất\&quot;)\nactivate App\nApp -&gt; App : Hiển thị hiệu ứng chờ (Typing Indicator)\nApp -&gt; Backend : POST /api/chatbot/message (rawInput)\nactivate Backend\n\nBackend -&gt; Backend : Lọc Prompt Injection &amp; Ẩn danh dữ liệu nhạy cảm (PII Masking)\nBackend -&gt; AI : Gửi Prompt đã làm sạch để phân tích NLP\nactivate AI\nAI --&gt; Backend : Trả về Intent (Pay_Utility_Bill / Find_Nearest_Branch) &amp; Entities\ndeactivate AI\n\nBackend -&gt; DB : Truy xuất dữ liệu ngữ cảnh (Mã KH đã lưu / Tọa độ chi nhánh)\nactivate DB\nDB --&gt; Backend : Trả về Context Data\ndeactivate DB\n\nBackend --&gt; App : Trả về JSON (message + ChatbotAction: destinationUri, params)\ndeactivate Backend\n\nApp --&gt; User : Hiển thị câu trả lời kèm Nút hành động (CTA Button / Card)\nUser -&gt; App : Nhấn vào Nút hành động (CTA Action)\nApp -&gt; App : Kích hoạt NavController / Intent Deep Link\\nMở màn hình đích &amp; Tự động điền dữ liệu (Auto-fill)\ndeactivate App\n\n&#39; ==================== PHẦN 2: TÍCH HỢP BẢN ĐỒ &amp; ĐIỀU HƯỚNG ====================\n== 2. Luồng Tích hợp Bản đồ &amp; Chỉ đường Đa phương tiện (Maps &amp; Navigation) ==\n\nUser -&gt; App : Mở Bản đồ Chi nhánh (Trực tiếp hoặc từ Deep Link Chatbot)\nactivate App\nApp -&gt; App : Kiểm tra quyền GPS (ACCESS_FINE_LOCATION)\nApp -&gt; GMaps : Gọi FusedLocationProviderClient lấy tọa độ\nactivate GMaps\nGMaps --&gt; App : Trả về tọa độ hiện tại (userLat, userLng)\ndeactivate GMaps\n\nApp -&gt; Backend : GET /api/branches/nearby?lat={userLat}&amp;lng={userLng}\nactivate Backend\nBackend -&gt; DB : Truy vấn không gian (Haversine / PostGIS ST_Distance)\nactivate DB\nDB --&gt; Backend : Danh sách 5-10 chi nhánh/ATM gần nhất\ndeactivate DB\nBackend --&gt; App : Trả về JSON danh sách BankBranch\ndeactivate Backend\n\nApp -&gt; App : Render Google Maps SDK, gắn Markers &amp; Gom cụm (Clustering)\nUser -&gt; App : Chọn chi nhánh &amp; Chọn phương tiện\\n(Đi bộ / Xe máy / Ô tô / Xe buýt)\nApp -&gt; App : Debounce (500ms-1s), xóa Polyline cũ &amp; Kiểm tra Route Cache\nApp -&gt; GMaps : HTTP GET Directions API (origin, destination, mode)\nactivate GMaps\nGMaps --&gt; App : Trả về JSON (overview_polyline, Distance, ETA)\ndeactivate GMaps\n\nApp -&gt; App : Decode Polyline, vẽ đường đi (PolylineOptions) &amp; Zoom LatLngBounds\nApp --&gt; User : Hiển thị lộ trình trực quan, khoảng cách và thời gian (ETA)\ndeactivate App\n\n&#39; ==================== PHẦN 3: LUỒNG CHỌN DỊCH VỤ ĐẾN THANH TOÁN ====================\n== 3. Luồng Chuẩn hóa từ Chọn Dịch vụ đến Bước Thanh toán (Utilities Payment) ==\n\nUser -&gt; App : [Bước 1] Chọn dịch vụ (Điện/Nước, Nạp thẻ, Vé bay/Phim/KS, TMĐT)\\n&amp; Nhập thông tin (hoặc nhận Auto-fill từ Chatbot)\nactivate App\nApp -&gt; Backend : [Bước 2] Gửi yêu cầu kiểm tra dịch vụ &amp; Khởi tạo đơn\nactivate Backend\n\nBackend -&gt; Provider : Gọi API truy vấn nợ cước / Kiểm tra tồn kho /\\nGiữ chỗ tạm thời (Seat/Room Hold 10-15 phút)\nactivate Provider\nProvider --&gt; Backend : Xác nhận khả dụng &amp; Trả về chi tiết cước/chỗ/tồn kho\ndeactivate Provider\n\nBackend -&gt; DB : Tạo bản ghi UtilityOrder (status = PENDING, lưu metadataJson)\nactivate DB\nDB --&gt; Backend : Trả về thông tin UtilityOrder\ndeactivate DB\nBackend --&gt; App : Hiển thị chi tiết đơn hàng &amp; Số tiền cần thanh toán\ndeactivate Backend\n\nUser -&gt; App : Nhấn \&quot;Xác nhận thanh toán\&quot;\nApp -&gt; Backend : Yêu cầu kiểm tra tài chính\nactivate Backend\nBackend -&gt; DB : [Bước 3] Kiểm tra trạng thái tài khoản (ACTIVE),\\nsố dư khả dụng &amp; hạn mức giao dịch trong ngày\nactivate DB\nDB --&gt; Backend : Tài khoản hợp lệ &amp; Đủ số dư\ndeactivate DB\nBackend --&gt; App : Yêu cầu xác thực bảo mật (Checker)\ndeactivate Backend\n\nApp --&gt; User : [Bước 4] Hiển thị màn hình yêu cầu OTP / Smart OTP / Sinh trắc học\nUser -&gt; App : Nhập mã OTP hoặc Quét Sinh trắc học\nApp -&gt; Backend : POST /api/utilities/confirm-payment (orderId, authToken)\nactivate Backend\n\nBackend -&gt; Backend : Xác thực OTP / Sinh trắc học thành công\nBackend -&gt; DB : [Bước 5] Trừ tiền tài khoản nguồn &amp; Ghi nhận bảng TRANSACTIONS\nactivate DB\nDB --&gt; Backend : Cập nhật số dư thành công\ndeactivate DB\n\nBackend -&gt; Provider : Gửi lệnh Gạch nợ / Top-up / Xuất vé (PNR/QR) / Tạo đơn vận chuyển\nactivate Provider\n\nalt Đồng bộ Đối tác Thành công\n    Provider --&gt; Backend : Trả kết quả thành công (Mã vé PNR / QR Code / Mã đơn)\n    Backend -&gt; DB : Cập nhật UtilityOrder (status = PAID) &amp; Lưu Context KH\n    Backend --&gt; App : Trả về Biên lai giao dịch điện tử\n    App --&gt; User : Hiển thị Biên lai thành công &amp; Vé điện tử / Mã đơn hàng\nelse Lỗi kết nối Đối tác / Timeout (Cơ chế Saga Rollback)\n    Provider --&gt; Backend : Lỗi xử lý hoặc Timeout\n    deactivate Provider\n    Backend -&gt; DB : Kích hoạt Rollback: Hoàn tiền tài khoản &amp; Cập nhật status = REFUNDED/EXPIRED\n    Backend --&gt; App : Thông báo lỗi giao dịch &amp; Đã hoàn tiền tự động\n    App --&gt; User : Hiển thị thông báo hoàn tiền an toàn\nend\ndeactivate Backend\ndeactivate App\n@enduml&quot;,&#xa;  &quot;config&quot;: null&#xa;}" id="bsNqpgowtc0m14YflYrr-1">
